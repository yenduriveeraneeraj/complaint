# Render Infrastructure Blueprint
services:
  # Spring Boot Backend Service
  - type: web
    name: cms-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://cms-mysql-db:3306/complaint_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  # MySQL Database Instance
  - name: cms-mysql-db
    databaseName: complaint_management_db
    user: root
    plan: free
